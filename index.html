<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nhà Tù Prompt</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="manifest" href="site.webmanifest">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06060a;--s1:#0c0c14;--s2:#14141e;--s3:#1c1c2a;--bd:#1a1a2e;--bd2:#252540;--tx:#e0e0f0;--tx2:#8080a0;--tx3:#505068;--ac:#7c6aff;--ac2:#9d8cff;--gn:#00d68f;--rd:#ff5c72;--yw:#ffb347;--pk:#ff6eb4;--g1:linear-gradient(135deg,#7c6aff,#ff6eb4);--g2:linear-gradient(135deg,#00d68f,#7c6aff);--g3:linear-gradient(135deg,#ff6eb4,#ffb347);--r:10px;--tr:all .25s cubic-bezier(.4,0,.2,1)}
html{font-size:15px}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(124,106,255,.07),transparent 50%),radial-gradient(ellipse at 80% 0%,rgba(255,110,180,.05),transparent 40%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(124,106,255,.3);border-radius:2px}
button,select,input,textarea{font-family:inherit}::selection{background:rgba(124,106,255,.3)}
.header{position:sticky;top:0;z-index:100;background:rgba(12,12,20,.75);backdrop-filter:blur(24px);border-bottom:1px solid rgba(124,106,255,.1);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:48px}
.h-left{display:flex;align-items:center;gap:10px}.logo{font-size:1.05rem;font-weight:700;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.h-right{display:flex;gap:6px;align-items:center}

.link-ext{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(255,110,180,.3);border-radius:var(--r);background:linear-gradient(135deg,rgba(255,110,180,.08),rgba(124,106,255,.05));color:var(--pk);font-size:.78rem;cursor:pointer;transition:var(--tr);white-space:nowrap;text-decoration:none;font-weight:600;position:relative;overflow:hidden}
.link-ext::before{content:'';position:absolute;inset:0;background:var(--g1);opacity:0;transition:opacity .3s}
.link-ext:hover{color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,110,180,.25)}
.link-ext:hover::before{opacity:.9}
.link-ext>*{position:relative;z-index:1}
.link-ext svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--s2);color:var(--tx2);font-size:.8rem;cursor:pointer;transition:var(--tr);white-space:nowrap;user-select:none;position:relative;overflow:hidden}.btn::before{content:'';position:absolute;inset:0;background:var(--g1);opacity:0;transition:opacity .3s}.btn:hover{color:var(--tx);border-color:rgba(124,106,255,.3);transform:translateY(-2px)}.btn:hover::before{opacity:.06}.btn:active{transform:translateY(0) scale(.97)}.btn>*{position:relative;z-index:1}
.btn-p{background:var(--g1);border-color:transparent;color:#fff;font-weight:500}.btn-p:hover{box-shadow:0 6px 24px rgba(124,106,255,.3)}
.btn-d{color:var(--rd);border-color:rgba(255,92,114,.15)}.btn-d:hover{background:rgba(255,92,114,.06)}
.btn-s{padding:4px 10px;font-size:.75rem}
.btn-w{color:var(--gn);border-color:rgba(0,214,143,.15)}.btn-w:hover{background:rgba(0,214,143,.06)}
.btn-y{color:var(--yw);border-color:rgba(255,179,71,.2)}.btn-y:hover{background:rgba(255,179,71,.06)}
.btn-i{width:32px;height:32px;padding:0;justify-content:center;font-size:.95rem;flex:1}
.btn-i svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.layout{display:flex;height:calc(100vh - 48px);position:relative;z-index:1}
.sb{width:240px;min-width:240px;background:linear-gradient(180deg,var(--s1),rgba(12,12,20,.95));border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sb-sec{padding:10px 10px 6px}.sb-t{font-size:.63rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);margin-bottom:4px;padding:0 6px;font-weight:700}
.sb-search input{width:100%;padding:7px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.82rem;outline:none;transition:var(--tr)}.sb-search input:focus{border-color:var(--ac)}
.seg{display:flex;gap:2px;padding:4px 10px;margin-bottom:2px}.seg-b{flex:1;padding:4px 0;border:none;border-radius:8px;background:transparent;color:var(--tx3);font-size:.72rem;cursor:pointer;text-align:center;font-weight:500;transition:var(--tr)}.seg-b:hover{color:var(--tx2)}.seg-b.on{background:var(--g1);color:#fff}
.ai-sec{padding:4px 10px 8px;border-bottom:1px solid var(--bd)}.ai-list{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}.ai-tag{padding:2px 7px;border:1px solid var(--bd);border-radius:6px;font-size:.68rem;cursor:pointer;color:var(--tx3);font-weight:500}.ai-tag:hover{color:var(--tx2)}.ai-tag.on{background:var(--g1);border-color:transparent;color:#fff}.ai-tag .x{margin-left:3px;opacity:.5;cursor:pointer;font-size:.6rem}.ai-tag .x:hover{opacity:1}
.ai-add-row{display:flex;gap:3px;margin-top:5px}.ai-inp{flex:1;padding:3px 7px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:.7rem;outline:none}.ai-abtn{padding:3px 7px;border:1px solid var(--bd);border-radius:6px;background:var(--s2);color:var(--tx2);font-size:.7rem;cursor:pointer}.ai-abtn:hover{background:var(--ac);color:#fff}

.cat-list{flex:1;overflow-y:auto;padding:4px 6px 6px}
.cat-i{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.82rem;transition:transform .2s,color .2s,background .2s,box-shadow .2s;color:var(--tx2);position:relative}
.cat-i::before{content:'';position:absolute;inset:0;border-radius:8px;background:var(--g1);opacity:0;transition:opacity .3s}
.cat-i>*{position:relative;z-index:1}
.cat-i:hover{transform:translateX(3px);color:var(--tx)}.cat-i:hover::before{opacity:.05}
.cat-i.on{color:var(--ac2)}.cat-i.on::before{opacity:.08}
.cat-i.drag-over{box-shadow:0 -3px 0 0 var(--ac) inset,0 0 15px rgba(124,106,255,.3);background:rgba(124,106,255,.08)}
.cat-i.drag-below{box-shadow:0 3px 0 0 var(--ac) inset,0 0 15px rgba(124,106,255,.3);background:rgba(124,106,255,.08)}
.cat-i.dragging{opacity:.4;transform:scale(.95);background:var(--s3);box-shadow:0 0 20px rgba(124,106,255,.4);cursor:grabbing}
.cat-i.dragging .cat-grip{opacity:1;color:var(--ac2)}
body.dragging-cat{cursor:grabbing!important}
body.dragging-cat *{cursor:grabbing!important}
.cat-grip{cursor:grab;color:var(--tx3);font-size:.75rem;padding:2px 4px;opacity:0;transition:opacity .2s;letter-spacing:1px;user-select:none;line-height:1}
.cat-i:hover .cat-grip{opacity:.8}
.cat-grip:hover{color:var(--ac2)!important;opacity:1!important}
.cat-grip:active{cursor:grabbing}
.cat-d{width:7px;height:7px;border-radius:3px;flex-shrink:0;transition:transform .25s;box-shadow:0 0 6px currentColor}
.cat-i:hover .cat-d{transform:scale(1.5)}
.cat-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-c{font-size:.68rem;color:var(--tx3);min-width:16px;text-align:right}
.cat-i.on .cat-c{color:var(--ac)}
.cat-a{display:flex;gap:1px;opacity:0;transition:opacity .2s;flex-shrink:0}
.cat-i:hover .cat-a{opacity:1}
.cat-ab{background:none;border:none;color:var(--tx3);cursor:pointer;padding:2px 4px;font-size:.63rem;border-radius:4px}
.cat-ab:hover{color:var(--tx);background:rgba(124,106,255,.1)}

.cat-secs{padding-left:16px;overflow:hidden;max-height:0;transition:max-height .3s ease}
.cat-i.on+.cat-secs{max-height:500px;padding-top:2px;padding-bottom:4px}
.sec-i{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:.75rem;transition:var(--tr);color:var(--tx3);position:relative;margin-bottom:1px}
.sec-i::before{content:'└';position:absolute;left:-6px;color:var(--tx3);opacity:.4}
.sec-i:hover{background:rgba(124,106,255,.06);color:var(--tx2);transform:translateX(2px)}
.sec-i.on{background:linear-gradient(90deg,rgba(124,106,255,.12),transparent);color:var(--ac2)}
.sec-i-icon{font-size:.7rem;opacity:.6;flex-shrink:0}
.sec-i-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-i-count{font-size:.63rem;color:var(--tx3);flex-shrink:0}
.sec-i.on .sec-i-count{color:var(--ac)}
.sec-add-mini{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;cursor:pointer;font-size:.7rem;color:var(--tx3);border:1px dashed var(--bd2);margin-top:2px;transition:var(--tr)}
.sec-add-mini:hover{border-color:var(--ac);color:var(--ac2);background:rgba(124,106,255,.04)}

.stats{padding:6px 12px;border-top:1px solid var(--bd);font-size:.63rem;color:var(--tx3);display:flex;gap:10px}
.trash-fab{position:fixed;bottom:20px;right:20px;z-index:90;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--s2),var(--s3));border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--tr);font-size:1.1rem;box-shadow:0 4px 20px rgba(0,0,0,.3)}.trash-fab:hover{transform:scale(1.12);border-color:var(--rd)}.trash-fab .tc{position:absolute;top:-4px;right:-4px;background:var(--g3);color:#fff;font-size:.58rem;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 4px}.trash-fab .tc.h{display:none}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tb{padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:44px;border-bottom:1px solid var(--bd);background:rgba(12,12,20,.5);gap:8px}
.tb-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.tb-cat{font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tb-cnt{font-size:.7rem;color:var(--tx3)}
.tb-r{display:flex;align-items:center;gap:6px}
.tb-sort{padding:4px 8px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx2);font-size:.75rem;outline:none;cursor:pointer}

.grid{flex:1;overflow-y:auto;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-content:start;grid-auto-rows:min-content}
.card{background:linear-gradient(160deg,rgba(124,106,255,.04),rgba(255,110,180,.02)),var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:var(--tr);position:relative;min-height:auto}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--g1);opacity:0;transition:opacity .3s;border-radius:12px 12px 0 0}
.card:hover{border-color:rgba(124,106,255,.2);transform:translateY(-3px);box-shadow:0 12px 36px rgba(124,106,255,.08)}.card:hover::before{opacity:1}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}.card-t{font-size:.88rem;font-weight:600;line-height:1.35;flex:1;word-break:break-word}.tags{display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap}.tag{font-size:.58rem;padding:2px 7px;border-radius:4px;font-weight:600;text-transform:uppercase}.tag-pc{background:rgba(124,106,255,.1);color:var(--ac2)}.tag-ph{background:rgba(0,214,143,.1);color:var(--gn)}.tag-bt{background:rgba(184,169,255,.1);color:var(--ac2)}.tag-ai{background:rgba(255,110,180,.1);color:var(--pk)}.tag-sec{background:rgba(124,106,255,.06);color:var(--ac2);font-size:.56rem}
.card-p{font-size:.78rem;color:var(--tx2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-tag{font-size:.63rem;padding:1px 6px;border-radius:4px;color:var(--tx3)}
.card-dt{font-size:.63rem;color:var(--tx3);margin-left:auto}
.card-act{display:flex;gap:6px;padding-top:10px;border-top:1px solid rgba(124,106,255,.08);margin-top:auto}
.btn-i{position:relative}
.btn-i::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(20,20,30,.95);color:var(--tx);font-size:.68rem;padding:4px 8px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;border:1px solid var(--bd2);z-index:10}
.btn-i:hover::after{opacity:1}

.section-div{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:14px 8px 6px;margin-top:6px}
.section-div:first-child{padding-top:2px;margin-top:0}
.section-icon{font-size:1rem;flex-shrink:0}
.section-name{font-size:.82rem;font-weight:700;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;flex-shrink:0}
.section-line{flex:1;height:2px;background:linear-gradient(90deg,rgba(124,106,255,.4),rgba(255,110,180,.2),transparent);border-radius:2px}
.section-count{font-size:.68rem;color:var(--tx3);background:var(--s2);padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx3);gap:8px;padding:40px;text-align:center;grid-column:1/-1;min-height:200px}.empty-tx{font-size:.88rem;color:var(--tx2)}.empty-sub{font-size:.78rem}

.mo{display:none;position:fixed;inset:0;background:rgba(4,4,8,.8);backdrop-filter:blur(12px);z-index:200;align-items:center;justify-content:center;padding:16px}.mo.show{display:flex}
.mo-box{background:var(--s1);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:580px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;animation:moIn .25s ease;box-shadow:0 32px 80px rgba(0,0,0,.5)}
@keyframes moIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.mo-h{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(180deg,rgba(124,106,255,.04),transparent);flex-shrink:0}.mo-t{font-size:.92rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.mo-x{background:none;border:none;color:var(--tx3);font-size:1.1rem;cursor:pointer;padding:4px 6px;border-radius:6px;transition:var(--tr)}.mo-x:hover{color:var(--tx);background:var(--s2);transform:rotate(90deg)}
.mo-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}.mo-f{padding:10px 16px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:6px;flex-shrink:0}
.fg{display:flex;flex-direction:column;gap:4px}.fl{font-size:.75rem;font-weight:500;color:var(--tx2)}.fl .req{color:var(--rd)}
.fi{padding:7px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.84rem;outline:none;transition:var(--tr)}.fi:focus{border-color:var(--ac)}
.ft{padding:8px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:.82rem;outline:none;resize:vertical;min-height:130px;font-family:Consolas,Monaco,monospace;line-height:1.65}.ft:focus{border-color:var(--ac)}
.ft-note{min-height:60px;font-family:inherit;font-size:.84rem;color:#c0c0d8}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.color-row{display:flex;align-items:center;gap:8px}.color-prev{width:32px;height:32px;border-radius:8px;border:2px solid var(--bd2)}.fi-color{flex:1;padding:3px;height:36px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;cursor:pointer}

#mWs.show{padding:0}
.ws-box{max-width:none!important;max-height:none!important;width:100vw!important;height:100vh!important;border-radius:0!important;border:none!important}
.ws-layout{display:flex;flex:1;overflow:hidden;min-height:0}
.ws-left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--bd);overflow:hidden;min-height:0}
.ws-right{width:380px;min-width:320px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.ws-pt{font-size:.68rem;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;padding:10px 16px 6px;flex-shrink:0}
.ws-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bd);font-size:.72rem;flex-shrink:0}
.ws-cw{flex:1;min-height:0;padding:6px 16px 12px;display:flex;flex-direction:column;overflow:hidden}
#wsView{flex:1;overflow-y:auto;padding:12px;font-family:Consolas,Monaco,monospace;font-size:.85rem;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:var(--r)}
#wsView mark{background:rgba(255,179,71,.2);color:var(--yw);border-radius:3px;padding:1px 4px}
#wsEditTA{display:none;flex:1;width:100%;padding:12px;background:var(--s2);border:2px solid var(--yw);border-radius:var(--r);color:var(--tx);font-size:.85rem;font-family:Consolas,Monaco,monospace;line-height:1.75;outline:none;resize:none;box-sizing:border-box;box-shadow:0 0 0 3px rgba(255,179,71,.1)}
#wsEditTA:focus{border-color:var(--yw)}
.ws-editing #wsView{display:none!important}
.ws-editing #wsEditTA{display:block!important}
.ws-editing #wsEditBtn{display:none}
.ws-editing #wsSaveBtn{display:inline-flex}
.ws-editing #wsCancelBtn{display:inline-flex}
#wsSaveBtn{display:none}#wsCancelBtn{display:none}
.ws-tmp{margin-top:8px;border:1px solid rgba(0,214,143,.3);border-radius:var(--r);background:rgba(0,214,143,.04);flex-shrink:0;max-height:220px;display:flex;flex-direction:column;overflow:hidden}
.ws-tmp-h{padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,214,143,.15);flex-shrink:0;gap:6px}
.ws-tmp-label{font-size:.68rem;font-weight:700;color:var(--gn);text-transform:uppercase}
.ws-tmp-body{padding:10px 12px;font-family:Consolas,Monaco,monospace;font-size:.82rem;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--tx);overflow-y:auto;flex:1}
.ws-editing .ws-tmp{display:none}
.ws-nw{border-top:1px solid var(--bd);flex-shrink:0;max-height:20%;display:flex;flex-direction:column;overflow:hidden}
.ws-nh{padding:8px 16px;flex-shrink:0}.ws-nl{font-size:.66rem;font-weight:700;background:var(--g2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase}
.ws-nb{overflow-y:auto;padding:0 16px 10px}.ws-nt{font-size:.82rem;color:#b0b0cc;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ws-fi{overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;max-height:50%}
.ws-fd{display:flex;flex-direction:column;gap:3px}.ws-fl{font-size:.72rem;color:var(--ac2);font-weight:600}.ws-fin{padding:8px 10px;background:var(--s3);border:1px solid var(--bd2);border-radius:8px;color:var(--tx);font-size:.84rem;outline:none;transition:var(--tr)}.ws-fin:focus{border-color:var(--yw)}
.ws-sc{padding:10px 14px;border-top:1px solid var(--bd);flex:1;display:flex;flex-direction:column;min-height:0}
.ws-sl{font-size:.66rem;font-weight:700;background:var(--g3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;margin-bottom:6px;flex-shrink:0}
.ws-sa{width:100%;padding:12px;background:var(--s3);border:1px solid var(--bd2);border-radius:var(--r);color:#c0c0d8;font-size:.84rem;outline:none;resize:none;flex:1;min-height:150px;line-height:1.6;font-family:inherit}.ws-sa:focus{border-color:var(--yw)}.ws-sa::placeholder{color:var(--tx3)}

.toast-c{position:fixed;top:56px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:4px;pointer-events:none}.toast{background:rgba(20,20,30,.95);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;font-size:.8rem;display:flex;align-items:center;gap:6px;animation:tIn .25s ease;box-shadow:0 8px 30px rgba(0,0,0,.3);pointer-events:auto;backdrop-filter:blur(8px)}.toast.ok{border-left:3px solid var(--gn);color:var(--gn)}.toast.err{border-left:3px solid var(--rd);color:var(--rd)}.toast.inf{border-left:3px solid var(--ac);color:var(--ac2)}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}.toast.out{opacity:0;transform:translateX(20px);transition:all .25s}
.menu-t{display:none;background:none;border:none;color:var(--tx);font-size:1.1rem;cursor:pointer;padding:4px 8px}.sb-ov{display:none;position:fixed;inset:0;background:rgba(4,4,8,.6);z-index:49}.sb-ov.show{display:block}
.tr-item{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--s2);border-radius:10px;margin-bottom:4px}.tr-info{flex:1;min-width:0}.tr-name{font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr-meta{font-size:.66rem;color:var(--tx3)}

@media(max-width:768px){
    .menu-t{display:block}
    .sb{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:left .3s;width:250px;min-width:250px}.sb.open{left:0}
    .grid{grid-template-columns:1fr;padding:10px}
    .tb{padding:0 10px}
    .fr3{grid-template-columns:1fr}
    .h-right .hm{display:none}
    .link-ext span{display:none}
    .link-ext{padding:6px 10px}
    .mo{padding:8px}#mWs.show{padding:0}
    .cat-grip{opacity:.8}
    .trash-fab{bottom:16px;right:16px;width:40px;height:40px}
    .ws-layout{flex-direction:column}
    .ws-left{border-right:none;border-bottom:1px solid var(--bd);flex:1.2}
    .ws-right{width:100%;min-width:0;flex:1}
}
@media(max-width:480px){html{font-size:14px}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}}
</style>

<div class="grid" id="grid"></div>
</main>
</div>
<div class="trash-fab" onclick="Z.trMo()">🗑<span class="tc" id="trC"></span></div>

<div class="mo" id="mPr"><div class="mo-box"><div class="mo-h"><div class="mo-t" id="mPrT"></div><button class="mo-x" onclick="Z.cl('mPr')">✕</button></div><div class="mo-b"><input type="hidden" id="eId"><div class="fg"><label class="fl">Tên <span class="req">*</span></label><input class="fi" id="pNm" maxlength="200"></div><div class="fr3"><div class="fg"><label class="fl">Danh mục <span class="req">*</span></label><select class="fi" id="pCat" onchange="Z.updSec()"></select></div><div class="fg"><label class="fl">Thiết bị</label><select class="fi" id="pDev"><option value="both">Cả hai</option><option value="pc">PC</option><option value="phone">Phone</option></select></div><div class="fg"><label class="fl">Agent AI</label><select class="fi" id="pAi"></select></div></div><div class="fg" id="pSecW" style="display:none"><label class="fl">📦 Ngăn (vách ngăn trong danh mục)</label><select class="fi" id="pSec"></select></div><div class="fg" id="pCW"><label class="fl">Nội dung <span class="req">*</span></label><textarea class="ft" id="pCt" placeholder="Dùng {{tên}} để tạo biến" rows="8"></textarea></div><div class="fg"><label class="fl">Ghi chú</label><textarea class="ft ft-note" id="pNt" rows="3"></textarea></div></div><div class="mo-f"><button class="btn" onclick="Z.cl('mPr')">Hủy</button><button class="btn btn-p" onclick="Z.savePr()"><span>Lưu</span></button></div></div></div>

<div class="mo" id="mWs">
    <div class="mo-box ws-box" id="wsBox">
        <div class="mo-h">
            <div class="mo-t" id="wsT"></div>
            <div style="display:flex;gap:4px;align-items:center">
                <button class="btn btn-s btn-y" id="wsEditBtn" onclick="Z.wsEdit()"><span>Sửa nội dung</span></button>
                <button class="btn btn-s btn-w" id="wsSaveBtn" onclick="Z.wsSave()"><span>Lưu tạm</span></button>
                <button class="btn btn-s" id="wsCancelBtn" onclick="Z.wsCancel()"><span>Hủy</span></button>

            </div>
        </div>
        <div class="ws-layout">
            <div class="ws-left">
                <div class="ws-meta" id="wsMeta"></div>
                <div class="ws-pt" id="wsPT">Nội dung gốc</div>
                <div class="ws-cw">
                    <div id="wsView"></div>
                    <textarea id="wsEditTA"></textarea>
                    <div class="ws-tmp" id="wsTmp" style="display:none">
                        <div class="ws-tmp-h">
                            <span class="ws-tmp-label">Bản tạm — sẵn sàng copy gửi AI</span>

                                <button class="btn btn-s btn-p" onclick="Z.cpTmp()"><span>Copy bản tạm</span></button>

            </div>
            <div class="ws-right">
                <div class="ws-pt" id="wsRT"></div>
                <div class="ws-fi" id="wsFi"></div>
                <div class="ws-sc"><div class="ws-sl">Bảng ghi chú tạm</div><textarea class="ws-sa" id="wsSc" placeholder="Nháp thông tin trước khi gửi AI...&#10;(không lưu khi đóng)"></textarea></div>

</div>

<div class="mo" id="mCt"><div class="mo-box" style="max-width:400px"><div class="mo-h"><div class="mo-t" id="mCtT"></div><button class="mo-x" onclick="Z.cl('mCt')">✕</button></div><div class="mo-b"><input type="hidden" id="eCId"><div class="fg"><label class="fl">Tên <span class="req">*</span></label><input class="fi" id="cNm" maxlength="100"></div><div class="fg"><label class="fl">Màu</label><div class="color-row"><div class="color-prev" id="cPv" style="background:#7c6aff"></div><input type="color" class="fi-color" id="cCl" value="#7c6aff" oninput="Z.cPv()"><input class="fi" id="cHx" value="#7c6aff" maxlength="7" style="width:80px;font-size:.78rem;font-family:monospace" oninput="Z.cSy(this.value)"></div></div></div><div class="mo-f"><button class="btn" onclick="Z.cl('mCt')">Hủy</button><button class="btn btn-p" onclick="Z.saveCat()"><span>Lưu</span></button></div></div></div>

<div class="mo" id="mSec"><div class="mo-box" style="max-width:400px"><div class="mo-h"><div class="mo-t" id="mSecT">📦 Thêm ngăn</div><button class="mo-x" onclick="Z.cl('mSec')">✕</button></div><div class="mo-b"><div class="fg"><label class="fl">Tên ngăn (VD: Frontend, Backend, Chương 1...)</label><input class="fi" id="secIn" maxlength="60" placeholder="Nhập tên ngăn..." onkeydown="event.key==='Enter'&&Z.secAdd()"></div></div><div class="mo-f"><button class="btn" onclick="Z.cl('mSec')">Hủy</button><button class="btn btn-p" onclick="Z.secAdd()"><span>+ Thêm ngăn</span></button></div></div></div>

<div class="mo" id="mTr"><div class="mo-box" style="max-width:620px"><div class="mo-h"><div class="mo-t">Thùng rác</div><button class="mo-x" onclick="Z.cl('mTr')">✕</button></div><div class="mo-b" id="trB" style="max-height:60vh"></div><div class="mo-f"><button class="btn btn-d" id="trClr" onclick="Z.trClr()" style="margin-right:auto"><span>Dọn sạch</span></button><button class="btn" onclick="Z.cl('mTr')">Đóng</button></div></div></div>
<div class="toast-c" id="toastC"></div>

<script>
!function(){"use strict";
var K='ntp_final_v1';
!function(){if(localStorage.getItem(K))return;var ac=[],ap=[],aa=[],at=[],ids={};['ntp_v5','ntp_v4','pm_data_v3','pm_data_v2','promptManager'].forEach(function(k){var r=localStorage.getItem(k);if(!r)return;try{var d=JSON.parse(r);(d.cats||d.categories||[]).forEach(function(c){if(c&&c.id&&!ids['c'+c.id]){ids['c'+c.id]=1;if(!Array.isArray(c.sections))c.sections=[];ac.push(c)}});(d.prompts||[]).forEach(function(p){if(p&&p.id&&p.name&&p.content&&!ids['p'+p.id]){ids['p'+p.id]=1;ap.push(p)}});(d.ais||[]).forEach(function(a){var u=(a||'').toUpperCase().trim();if(u&&!ids['a'+u]){ids['a'+u]=1;aa.push(u)}});(d.trash||[]).forEach(function(t){if(t&&t.id&&!ids['t'+t.id]){ids['t'+t.id]=1;at.push(t)}})}catch(e){}});if(ac.length||ap.length)localStorage.setItem(K,JSON.stringify({cats:ac,prompts:ap,ais:aa.length?aa:['GEMINI','ARENA.AI','GAMMA','CANVA','PPT COPILOT'],trash:at}))}();
var DC=[{id:'c1',name:'Prompt cho Code',color:'#3b82f6',sections:[]},{id:'c2',name:'Prompt cho AI',color:'#7c6aff',sections:[]},{id:'c3',name:'Prompt cho PPT',color:'#f97316',sections:[]},{id:'c4',name:'Prompt cho Viết',color:'#00d68f',sections:[]},{id:'c5',name:'Prompt cho Hình Ảnh',color:'#ff6eb4',sections:[]},{id:'c6',name:'Khác',color:'#06b6d4',sections:[]}];
var DA=['GEMINI','ARENA.AI','GAMMA','CANVA','PPT COPILOT'];
var C,P,AI,TR,aCat='all',aSec='',aDev='all',aAi='all',sQ='',_st,_wi,_tmp='',hist=['all'];
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function esc(t){if(!t)return'';var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function fmt(ts){if(!ts)return'';var d=new Date(ts);return isNaN(d)?'':[d.getDate(),d.getMonth()+1].map(function(v){return String(v).padStart(2,'0')}).join('/')+'/'+d.getFullYear()+' '+[d.getHours(),d.getMinutes()].map(function(v){return String(v).padStart(2,'0')}).join(':')}
function load(){try{var r=localStorage.getItem(K);if(r){var o=JSON.parse(r);C=o.cats||[];P=o.prompts||[];AI=o.ais||[];TR=o.trash||[]}else{C=JSON.parse(JSON.stringify(DC));P=[];AI=DA.slice();TR=[]}}catch(e){C=JSON.parse(JSON.stringify(DC));P=[];AI=DA.slice();TR=[]}P=P.filter(function(p){return p&&p.id&&p.name&&p.content});TR=TR.filter(function(p){return p&&p.id});C.forEach(function(c){if(!Array.isArray(c.sections))c.sections=[]})}
function save(){try{localStorage.setItem(K,JSON.stringify({cats:C,prompts:P,ais:AI,trash:TR}))}catch(e){toast('Lỗi lưu','err')}}
function toast(m,t){var c=$('toastC'),e=document.createElement('div');e.className='toast '+(t==='ok'?'ok':t==='err'?'err':'inf');e.textContent=m;c.appendChild(e);setTimeout(function(){e.classList.add('out');setTimeout(function(){e.remove()},300)},2500)}
function op(i){$(i).classList.add('show')}function cl(i){$(i).classList.remove('show')}
document.addEventListener('click',function(e){if(e.target.classList.contains('mo')&&e.target.classList.contains('show')&&e.target.id!=='mWs')e.target.classList.remove('show')});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=document.querySelectorAll('.mo.show');if(m.length)m[m.length-1].classList.remove('show')}});
function toggleSb(){$('sb').classList.toggle('open');$('sbOv').classList.toggle('show')}
function closeSbM(){if(innerWidth<=768){$('sb').classList.remove('open');$('sbOv').classList.remove('show')}}
function pushH(c){hist.push(c);history.pushState(null,'')}
addEventListener('popstate',function(){if(hist.length>1){hist.pop();aCat=hist[hist.length-1]||'all';aSec='';rAll()}});
function fC(id){return C.find(function(c){return c.id===id})}
function fP(id){return P.find(function(p){return p.id===id})}
function rAi(){var h='<span class="ai-tag'+(aAi==='all'?' on':'')+'" onclick="Z.aiF(\'all\')">Tất cả</span>';AI.forEach(function(a){h+='<span class="ai-tag'+(aAi===a?' on':'')+'" onclick="Z.aiF(\''+esc(a)+'\')">'+esc(a)+'<span class="x" onclick="event.stopPropagation();Z.aiDel(\''+esc(a)+'\')">✕</span></span>'});$('aiL').innerHTML=h}
function aiAdd(){var v=($('aiIn').value||'').trim().toUpperCase();if(!v)return toast('Nhập tên','err');if(AI.indexOf(v)>-1)return toast('Đã tồn tại','err');AI.push(v);$('aiIn').value='';save();rAi();uAiS();toast('Đã thêm','ok')}
function aiDel(n){AI=AI.filter(function(a){return a!==n});P.forEach(function(p){if(p.ai===n)p.ai=''});if(aAi===n)aAi='all';save();rAi();uAiS();ren();toast('Đã xóa','ok')}
function aiF(n){aAi=n;rAi();ren();closeSbM()}
function uAiS(){$('pAi').innerHTML='<option value="">—</option>'+AI.map(function(a){return'<option>'+esc(a)+'</option>'}).join('')}
function selSec(catId,secName){aCat=catId;aSec=secName;rCats();ren();uTb();closeSbM()}
function openSecAdd(catId,e){if(e)e.stopPropagation();aCat=catId;$('secIn').value='';op('mSec');setTimeout(function(){$('secIn').focus()},100)}
function secAdd(){var c=fC(aCat);if(!c){toast('Chọn 1 danh mục','err');return}var v=($('secIn').value||'').trim();if(!v)return toast('Nhập tên ngăn','err');if(c.sections.some(function(s){return s.toLowerCase()===v.toLowerCase()}))return toast('Ngăn đã có','err');c.sections.push(v);$('secIn').value='';save();cl('mSec');rCats();ren();toast('Đã tạo ngăn "'+v+'"','ok')}
function secDel(catId,secName,e){if(e)e.stopPropagation();if(!confirm('Xóa ngăn "'+secName+'"? Prompt trong ngăn sẽ về "Chưa phân ngăn".'))return;var c=fC(catId);if(!c)return;P.forEach(function(p){if(p.category===catId&&p.section===secName)p.section=''});c.sections=c.sections.filter(function(s){return s!==secName});if(aSec===secName)aSec='';save();rCats();ren();toast('Đã xóa ngăn','ok')}
function updSec(){var catId=$('pCat').value,c=fC(catId),w=$('pSecW'),s=$('pSec');if(!c||!c.sections.length){w.style.display='none';return}w.style.display='';s.innerHTML='<option value="">— Không phân ngăn —</option>'+c.sections.map(function(x){return'<option value="'+esc(x)+'">📦 '+esc(x)+'</option>'}).join('')}

function rCats(){
    var co={};P.forEach(function(p){co[p.category]=(co[p.category]||0)+1});
    var secCo={};P.forEach(function(p){if(p.section){var k=p.category+'||'+p.section;secCo[k]=(secCo[k]||0)+1}});
    var h='<div class="cat-i'+(aCat==='all'?' on':'')+'" onclick="Z.selCat(\'all\')"><div class="cat-d" style="background:#666;color:#666"></div><div class="cat-n">Tất cả</div><div class="cat-c">'+P.length+'</div></div>';
    C.forEach(function(c){
        var isOn=aCat===c.id;
        h+='<div class="cat-i'+(isOn&&!aSec?' on':'')+'" data-cid="'+c.id+'"><span class="cat-grip" data-grip="'+c.id+'">⋮⋮</span><div class="cat-d" style="background:'+c.color+';color:'+c.color+'"></div><div class="cat-n" onclick="Z.selCat(\''+c.id+'\')">'+esc(c.name)+'</div><div class="cat-c">'+(co[c.id]||0)+'</div><div class="cat-a"><button class="cat-ab" onclick="event.stopPropagation();Z.eCat(\''+c.id+'\')">sửa</button><button class="cat-ab" onclick="event.stopPropagation();Z.dCat(\''+c.id+'\')">xóa</button></div></div>';
        if(isOn){
            h+='<div class="cat-secs" style="max-height:500px;padding-top:2px;padding-bottom:4px">';
            c.sections.forEach(function(sn){
                var cnt=secCo[c.id+'||'+sn]||0;
                h+='<div class="sec-i'+(aSec===sn?' on':'')+'" onclick="Z.selSec(\''+c.id+'\',\''+esc(sn).replace(/'/g,"\\'")+'\')"><span class="sec-i-icon">📦</span><span class="sec-i-name">'+esc(sn)+'</span><span class="sec-i-count">'+cnt+'</span><button class="cat-ab" onclick="Z.secDel(\''+c.id+'\',\''+esc(sn).replace(/'/g,"\\'")+'\',event)" title="Xóa ngăn">✕</button></div>';
            });
            h+='<div class="sec-add-mini" onclick="Z.openSecAdd(\''+c.id+'\',event)">+ Thêm ngăn</div>';
            h+='</div>';
        }
    });
    $('catL').innerHTML=h;bDrag();rSt();uTF();
}
function uTF(){var e=$('trC');e.textContent=TR.length||'';e.classList.toggle('h',!TR.length)}
function rSt(){var p=0,h=0,b=0;P.forEach(function(x){x.device==='pc'?p++:x.device==='phone'?h++:b++});$('sts').innerHTML='Tổng '+P.length+' · PC '+p+' · Phone '+h+' · Cả hai '+b}
function selCat(id){if(aCat!==id||aSec){pushH(id);aSec=''}aCat=id;rAll()}
function rAll(){rCats();ren();uTb();closeSbM()}
function devF(d){aDev=d;document.querySelectorAll('.seg-b').forEach(function(b){b.classList.toggle('on',b.dataset.d===d)});ren()}
function doSch(){sQ=($('sIn').value||'').trim().toLowerCase();ren()}
function uTb(){if(aCat==='all')$('tbCat').textContent='Tất cả';else{var c=fC(aCat);$('tbCat').textContent=(c?c.name:'?')+(aSec?' › 📦 '+aSec:'')}}
function uCS(){$('pCat').innerHTML=C.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')}

function bDrag(){
    document.querySelectorAll('.cat-i[data-cid] .cat-grip').forEach(function(g){
        g.onmousedown=function(e){
            e.preventDefault();e.stopPropagation();
            var el=g.closest('.cat-i');
            var did=el.dataset.cid;
            el.classList.add('dragging');
            document.body.classList.add('dragging-cat');
            toast('Đang kéo — thả vào vị trí mới','inf');
            document.onmousemove=function(ev){clD();var t=dT(ev.clientX,ev.clientY);if(t&&t.id!==did){var r=t.el.getBoundingClientRect();t.el.classList.add(ev.clientY<r.top+r.height/2?'drag-over':'drag-below')}};
            document.onmouseup=function(ev){document.onmousemove=document.onmouseup=null;document.body.classList.remove('dragging-cat');var t=dT(ev.clientX,ev.clientY);if(t&&t.id!==did){var r=t.el.getBoundingClientRect();mvC(did,t.id,ev.clientY>=r.top+r.height/2)}clD()};
        };
        g.ontouchstart=function(e){
            if(e.touches.length!==1)return;
            e.preventDefault();e.stopPropagation();
            var el=g.closest('.cat-i');
            var did=el.dataset.cid;
            el.classList.add('dragging');
            document.body.classList.add('dragging-cat');
            toast('Đang kéo — thả vào vị trí mới','inf');
            var tid=e.touches[0].identifier;
            var tm=function(ev){ev.preventDefault();var t=null;for(var i=0;i<ev.touches.length;i++)if(ev.touches[i].identifier===tid){t=ev.touches[i];break}if(!t)return;clD();var tg=dT(t.clientX,t.clientY);if(tg&&tg.id!==did){var r=tg.el.getBoundingClientRect();tg.el.classList.add(t.clientY<r.top+r.height/2?'drag-over':'drag-below')}};
            var te=function(ev){document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',te);document.removeEventListener('touchcancel',te);document.body.classList.remove('dragging-cat');var t=null;if(ev.changedTouches)for(var i=0;i<ev.changedTouches.length;i++)if(ev.changedTouches[i].identifier===tid){t=ev.changedTouches[i];break}if(t){var tg=dT(t.clientX,t.clientY);if(tg&&tg.id!==did){var r=tg.el.getBoundingClientRect();mvC(did,tg.id,t.clientY>=r.top+r.height/2)}}clD()};
            document.addEventListener('touchmove',tm,{passive:false});
            document.addEventListener('touchend',te);
            document.addEventListener('touchcancel',te);
        };
    });
}
function clD(){document.querySelectorAll('.cat-i[data-cid]').forEach(function(e){e.classList.remove('drag-over','drag-below','dragging')})}
function dT(x,y){var r=null;document.querySelectorAll('.cat-i[data-cid]').forEach(function(el){var b=el.getBoundingClientRect();if(y>=b.top&&y<=b.bottom)r={el:el,id:el.dataset.cid}});return r}
function mvC(f,t,below){var fi=C.findIndex(function(c){return c.id===f});if(fi<0)return;var item=C.splice(fi,1)[0];var ti=C.findIndex(function(c){return c.id===t});if(ti<0)ti=C.length;if(below)ti++;C.splice(ti,0,item);save();rCats();uCS();toast('Đã sắp xếp danh mục','ok')}

function getF(){var list=P.filter(function(p){if(aCat!=='all'&&p.category!==aCat)return false;if(aSec&&(p.section||'')!==aSec)return false;if(aDev!=='all'&&p.device!==aDev&&p.device!=='both')return false;if(aAi!=='all'&&(p.ai||'')!==aAi)return false;if(sQ&&[p.name,p.content,p.note,p.ai].join(' ').toLowerCase().indexOf(sQ)<0)return false;return true});var s=$('tbSort').value;return list.sort(function(a,b){return s==='oldest'?(a.created||0)-(b.created||0):s==='az'?(a.name||'').localeCompare(b.name||'','vi'):s==='za'?(b.name||'').localeCompare(a.name||'','vi'):(b.created||0)-(a.created||0)})}
function ren(){var g=$('grid'),l=getF();$('tbCnt').textContent=l.length+' prompt';if(!l.length)return g.innerHTML='<div class="empty"><div class="empty-tx">'+(sQ?'Không tìm thấy':'Chưa có prompt')+'</div><div class="empty-sub">'+(sQ?'Thử từ khóa khác':'Bấm + để bắt đầu')+'</div></div>';if(aCat!=='all'&&!aSec){rGrp(l)}else{rFlat(l)}}
function rFlat(l){$('grid').innerHTML=l.map(bCard).join('')}
function rGrp(l){var c=fC(aCat);if(!c||!c.sections.length){rFlat(l);return}var gr={},ns=[];l.forEach(function(p){var s=p.section||'';s&&c.sections.indexOf(s)>-1?(gr[s]=gr[s]||[]).push(p):ns.push(p)});var h='';c.sections.forEach(function(sn){if(!gr[sn])return;h+='<div class="section-div"><span class="section-icon">📦</span><span class="section-name">'+esc(sn)+'</span><span class="section-line"></span><span class="section-count">'+gr[sn].length+'</span></div>';gr[sn].forEach(function(p){h+=bCard(p)})});if(ns.length){if(h)h+='<div class="section-div"><span class="section-icon">📋</span><span class="section-name">Chưa phân ngăn</span><span class="section-line"></span><span class="section-count">'+ns.length+'</span></div>';ns.forEach(function(p){h+=bCard(p)})}$('grid').innerHTML=h}

    copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',

function bCard(p){var c=fC(p.category),cn=c?c.name:'—',cc=c?c.color:'#555';return'<div class="card" data-pid="'+p.id+'"><div class="card-h"><div class="card-t">'+esc(p.name)+'</div><div class="tags">'+(p.section?'<span class="tag tag-sec">📦 '+esc(p.section)+'</span>':'')+(p.ai?'<span class="tag tag-ai">'+esc(p.ai)+'</span>':'')+(p.device==='pc'?'<span class="tag tag-pc">PC</span>':p.device==='phone'?'<span class="tag tag-ph">PHONE</span>':'<span class="tag tag-bt">ALL</span>')+'</div></div><div class="card-p">'+esc(p.content)+'</div><div class="card-m"><span class="card-tag" style="border-left:2px solid '+cc+';padding-left:6px">'+esc(cn)+'</span><span class="card-dt">'+fmt(p.created)+'</span></div><div class="card-act"><button class="btn btn-i" data-tip="Xem" onclick="event.stopPropagation();Z.view(\''+p.id+'\')">'+ICONS.view+'</button><button class="btn btn-i" data-tip="Sao chép" onclick="event.stopPropagation();Z.cp(\''+p.id+'\')">'+ICONS.copy+'</button><button class="btn btn-i" data-tip="Sửa" onclick="event.stopPropagation();Z.eMeta(\''+p.id+'\')">'+ICONS.edit+'</button><button class="btn btn-i btn-d" data-tip="Xóa" onclick="event.stopPropagation();Z.del(\''+p.id+'\')">'+ICONS.del+'</button></div></div>'}

function exV(c){if(!c)return[];var r=/\{\{([^}]+)\}\}/g,m,v=[],s={};while((m=r.exec(c))!==null){var k=m[1].trim();if(k&&!s[k]){s[k]=1;v.push(k)}}return v}
function fillC(c,vl){return c.replace(/\{\{([^}]+)\}\}/g,function(m,k){var v=k.trim();return vl[v]!=null&&vl[v]!==''?vl[v]:m})}
function hlF(c,vl){return esc(c).replace(/\{\{([^}]+)\}\}/g,function(m,k){var v=k.trim();return vl[v]!=null&&vl[v]!==''?'<mark>'+esc(vl[v])+'</mark>':m})}
function gVals(){var vl={};document.querySelectorAll('#wsFi .ws-fin').forEach(function(i){vl[i.dataset.v]=i.value});return vl}

function view(id){var p=fP(id);if(!p)return;_wi=id;_tmp='';var c=fC(p.category);$('wsT').textContent=p.name;$('wsMeta').innerHTML='<span class="card-tag" style="border-left:2px solid '+(c?c.color:'#555')+';padding-left:6px">'+esc(c?c.name:'—')+'</span>'+(p.section?'<span class="tag tag-sec">📦 '+esc(p.section)+'</span>':'')+(p.ai?'<span class="tag tag-ai">'+esc(p.ai)+'</span>':'')+'<span class="tag tag-pc">'+(p.device==='pc'?'PC':p.device==='phone'?'Phone':'Cả hai')+'</span><span class="card-dt">'+fmt(p.created)+'</span>';p.note?($('wsNt').textContent=p.note,$('wsNW').style.display='flex'):$('wsNW').style.display='none';$('wsSc').value='';var vars=exV(p.content);if(vars.length){$('wsRT').textContent='Điền thông tin ('+vars.length+' biến)';$('wsFi').innerHTML=vars.map(function(v){return'<div class="ws-fd"><label class="ws-fl">'+esc(v)+'</label><input class="ws-fin" data-v="'+esc(v)+'" placeholder="'+esc(v)+'..." oninput="Z.wsUp()"></div>'}).join('')}else{$('wsRT').textContent='Ghi chú tạm';$('wsFi').innerHTML=''}$('wsCpBtn').querySelector('span').textContent=vars.length?'Chép kết quả':'Sao chép gốc';$('wsBox').classList.remove('ws-editing');$('wsPT').textContent='Nội dung gốc';$('wsView').innerHTML=esc(p.content);$('wsEditTA').value='';$('wsTmp').style.display='none';op('mWs');if(vars.length){var f=$('wsFi').querySelector('.ws-fin');if(f)setTimeout(function(){f.focus()},150)}}
function wsEdit(){var p=fP(_wi);if(!p)return;var vars=exV(p.content);var content=vars.length?fillC(p.content,gVals()):p.content;$('wsEditTA').value=content;$('wsPT').textContent='ĐANG SỬA — nội dung gốc KHÔNG thay đổi';$('wsBox').classList.add('ws-editing');setTimeout(function(){$('wsEditTA').focus()},50)}
function wsSave(){var v=($('wsEditTA').value||'').trim();if(!v)return toast('Nội dung trống','err');_tmp=v;$('wsBox').classList.remove('ws-editing');$('wsPT').textContent='Nội dung gốc';$('wsTmpBody').textContent=_tmp;$('wsTmp').style.display='flex';toast('Đã lưu tạm','ok')}

function wsCopy(){var p=fP(_wi);if(!p)return;var vars=exV(p.content);doCopy(vars.length?fillC(p.content,gVals()):p.content)}
function wsUp(){var p=fP(_wi);if(!p)return;$('wsView').innerHTML=hlF(p.content,gVals())}
function doCopy(t){if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(t).then(function(){toast('Đã sao chép','ok')}).catch(function(){fbCp(t)});else fbCp(t)}
function fbCp(t){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px';document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy');toast('Đã sao chép','ok')}catch(e){}a.remove()}
function addCat(){$('mCtT').textContent='Thêm danh mục';$('eCId').value='';$('cNm').value='';$('cCl').value='#7c6aff';$('cHx').value='#7c6aff';$('cPv').style.background='#7c6aff';op('mCt');setTimeout(function(){$('cNm').focus()},100)}
function eCat(id){var c=fC(id);if(!c)return;$('mCtT').textContent='Sửa danh mục';$('eCId').value=id;$('cNm').value=c.name;$('cCl').value=c.color;$('cHx').value=c.color;$('cPv').style.background=c.color;op('mCt')}
function saveCat(){var e=($('eCId').value||'').trim(),n=($('cNm').value||'').trim(),co=$('cCl').value;if(!n)return toast('Nhập tên','err');if(C.some(function(c){return c.name.toLowerCase()===n.toLowerCase()&&c.id!==e}))return toast('Đã tồn tại','err');if(e){var c=fC(e);if(c){c.name=n;c.color=co}}else C.push({id:uid(),name:n,color:co,sections:[]});save();rCats();uCS();uTb();cl('mCt');toast(e?'Đã cập nhật':'Đã thêm','ok')}
function dCat(id){var c=fC(id);if(!c)return;if(!confirm('Xóa danh mục "'+c.name+'"?'))return;var cnt=P.filter(function(p){return p.category===id}).length;if(cnt){var fb=C.find(function(x){return x.id!==id});if(!fb){fb={id:uid(),name:'Khác',color:'#06b6d4',sections:[]};C.push(fb)}P.forEach(function(p){if(p.category===id){p.category=fb.id;p.section=''}})}C=C.filter(function(x){return x.id!==id});if(aCat===id){aCat='all';aSec=''}save();rAll();uCS();toast('Đã xóa','ok')}

function eMeta(id){var p=fP(id);if(!p)return;$('mPrT').textContent='Sửa prompt';$('eId').value=id;$('pNm').value=p.name;$('pDev').value=p.device||'both';$('pNt').value=p.note||'';$('pCt').value=p.content;$('pCW').style.display='';uCS();uAiS();$('pCat').value=p.category;$('pAi').value=p.ai||'';updSec();$('pSec').value=p.section||'';cl('mWs');op('mPr');setTimeout(function(){$('pNm').focus()},100)}

function trRes(id){var i=TR.findIndex(function(p){return p.id===id});if(i<0)return;var it=TR.splice(i,1)[0];delete it.deletedAt;if(!fC(it.category)){it.category=C.length?C[0].id:(function(){var f={id:uid(),name:'Khôi phục',color:'#06b6d4',sections:[]};C.push(f);return f.id})()}P.push(it);save();rCats();ren();rTrL();uTF();toast('Đã khôi phục','ok')}
