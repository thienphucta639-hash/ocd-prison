<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Physics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #fafafa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Chứa các mục HTML di chuyển đồng bộ với vật lý */
        #items-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none; /* Để canvas nhận diện chuột */
        }

        .matter-item {
            position: absolute;
            top: 0; left: 0;
            transform-origin: center;
            will-change: transform;
            user-select: none;
            white-space: nowrap;
        }

        /* Lớp vật lý trong suốt nằm đè lên để bắt sự kiện chuột */
        #physics-canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 10;
        }

        /* Giao diện nút bấm luôn nổi trên cùng */
        .ui-layer {
            position: relative;
            z-index: 20;
            pointer-events: none; /* Cho phép click xuyên qua vùng trống */
        }
        
        .ui-layer button {
            pointer-events: auto; /* Chỉ bắt click ở các nút */
        }
    </style>
</head>
<body>

    <!-- GIAO DIỆN BẢNG ĐIỀU KHIỂN -->
    <div class="ui-layer w-full flex flex-col items-center justify-center pt-20 gap-6">
        <div class="text-5xl md:text-7xl font-bold text-zinc-800 tracking-tight text-center">
            Interactive <span class="text-[#e46b5a] italic">Physics</span>
        </div>
        
        <div class="flex gap-4 mt-4">
            <button id="btn-gravity" class="flex items-center gap-2 px-6 py-3 rounded-full font-semibold transition-all shadow-lg active:scale-95 bg-white border-2 border-zinc-200 text-zinc-800 hover:bg-zinc-100">
                <svg id="icon-wind" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="block"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg>
                <svg id="icon-rocket" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
                <span id="text-gravity">Mất trọng lực</span>
            </button>
            
            <button id="btn-reset" class="flex items-center gap-2 px-6 py-3 rounded-full bg-[#e46b5a] text-white font-semibold hover:bg-[#c45242] transition-all shadow-lg active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Bơm Oxy (Reset)
            </button>
        </div>
    </div>

    <!-- CÁC KHỐI VẬT LÝ -->
    <!-- data-x và data-y là vị trí tương đối (% màn hình), data-angle là góc xoay -->
    <div id="items-container">
        <div class="matter-item px-8 py-4 bg-[#0015ff] text-white rounded-full text-xl md:text-2xl font-bold shadow-xl" data-x="0.2" data-y="0.1" data-angle="0">
            React.js
        </div>
        <div class="matter-item px-8 py-4 bg-[#E794DA] text-white rounded-full text-xl md:text-2xl font-bold shadow-xl" data-x="0.35" data-y="0.3" data-angle="0">
            UI Design
        </div>
        <div class="matter-item px-8 py-4 bg-[#1f464d] text-white rounded-full text-xl md:text-2xl font-bold shadow-xl" data-x="0.5" data-y="0.15" data-angle="0.17">
            Typescript
        </div>
        <div class="matter-item px-8 py-4 bg-[#ff5941] text-white rounded-full text-xl md:text-2xl font-bold shadow-xl" data-x="0.7" data-y="0.2" data-angle="0">
            Tailwind CSS
        </div>
        <div class="matter-item px-8 py-4 bg-orange-500 text-white rounded-full text-xl md:text-2xl font-bold shadow-xl" data-x="0.8" data-y="0.4" data-angle="-0.26">
            Frontend
        </div>
        <div class="matter-item px-8 py-4 bg-[#ffd726] text-zinc-900 rounded-full text-xl md:text-2xl font-bold shadow-xl" data-x="0.6" data-y="0.5" data-angle="0">
            Matter.js
        </div>
    </div>

    <!-- KỊCH BẢN VẬT LÝ -->
    <script>
        const { Engine, Render, Runner, World, Bodies, Mouse, MouseConstraint, Events } = Matter;

        // Khởi tạo Engine
        const engine = Engine.create();
        let width = window.innerWidth;
        let height = window.innerHeight;

        // Khởi tạo Render (Canvas trong suốt bắt sự kiện chuột)
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: width,
                height: height,
                background: 'transparent',
                wireframes: false
            }
        });
        render.canvas.id = 'physics-canvas';

        // Lấy danh sách các mục HTML
        const domItems = document.querySelectorAll('.matter-item');
        const bodiesData = [];

        // Đồng bộ HTML vào thế giới Matter.js
        domItems.forEach(el => {
            const rect = el.getBoundingClientRect();
            const startX = width * parseFloat(el.getAttribute('data-x'));
            const startY = height * parseFloat(el.getAttribute('data-y'));
            const angle = parseFloat(el.getAttribute('data-angle')) || 0;

            const body = Bodies.rectangle(startX, startY, rect.width, rect.height, {
                angle: angle,
                chamfer: { radius: rect.height / 2 }, // Bo tròn các góc giống rounded-full
                restitution: 0.2, // Độ nảy
                friction: 0.5,
                render: { visible: false } // Ẩn hình chữ nhật đen mặc định
            });

            bodiesData.push({ dom: el, body: body, startX, startY, startAngle: angle });
            World.add(engine.world, body);
        });

        // Bức tường (Tĩnh)
        const wallOptions = { isStatic: true, render: { visible: false } };
        let bottomWall = Bodies.rectangle(width / 2, height + 50, width * 2, 100, wallOptions);
        let leftWall = Bodies.rectangle(-50, height / 2, 100, height * 2, wallOptions);
        let rightWall = Bodies.rectangle(width + 50, height / 2, 100, height * 2, wallOptions);
        let topWall = Bodies.rectangle(width / 2, -150, width * 2, 100, wallOptions); // Tường trên chặn bay mất tiêu
        World.add(engine.world, [bottomWall, leftWall, rightWall, topWall]);

        // Cấu hình Kéo thả
        const mouse = Mouse.create(render.canvas);
        const mConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { stiffness: 0.2, render: { visible: false } }
        });
        World.add(engine.world, mConstraint);
        render.mouse = mouse;

        // Cập nhật vị trí HTML theo Physic Loop
        Events.on(engine, 'afterUpdate', () => {
            bodiesData.forEach(({ dom, body }) => {
                const { x, y } = body.position;
                dom.style.transform = `translate(${x - dom.offsetWidth / 2}px, ${y - dom.offsetHeight / 2}px) rotate(${body.angle}rad)`;
            });

            // Đổi con trỏ chuột
            if (mConstraint.body) {
                render.canvas.style.cursor = 'grabbing';
            } else {
                const hovered = Matter.Query.point(engine.world.bodies, mouse.position).length > 0;
                render.canvas.style.cursor = hovered ? 'grab' : 'default';
            }
        });

        // Chạy Engine
        Runner.run(Runner.create(), engine);
        Render.run(render);

        // --- CÁC NÚT TƯƠNG TÁC ---
        let isZeroGravity = false;
        const btnGravity = document.getElementById('btn-gravity');
        const iconWind = document.getElementById('icon-wind');
        const iconRocket = document.getElementById('icon-rocket');
        const textGravity = document.getElementById('text-gravity');

        // Bật / Tắt trọng lực
        btnGravity.addEventListener('click', () => {
            isZeroGravity = !isZeroGravity;
            
            // Chỉnh lực hút (âm = bay lên, dương = rơi xuống)
            engine.gravity.y = isZeroGravity ? -0.05 : 1;
            
            // Chỉnh giao diện nút
            if (isZeroGravity) {
                btnGravity.className = "flex items-center gap-2 px-6 py-3 rounded-full font-semibold transition-all shadow-lg active:scale-95 bg-[#1f464d] text-white hover:bg-[#153237]";
                iconWind.classList.add('hidden');
                iconRocket.classList.remove('hidden');
                textGravity.innerText = 'Khôi phục trọng lực';
            } else {
                btnGravity.className = "flex items-center gap-2 px-6 py-3 rounded-full font-semibold transition-all shadow-lg active:scale-95 bg-white border-2 border-zinc-200 text-zinc-800 hover:bg-zinc-100";
                iconWind.classList.remove('hidden');
                iconRocket.classList.add('hidden');
                textGravity.innerText = 'Mất trọng lực';
            }
        });

        // Bơm Oxy (Reset)
        document.getElementById('btn-reset').addEventListener('click', () => {
            // Tắt chế độ không trọng lực
            isZeroGravity = false;
            engine.gravity.y = 1;
            btnGravity.className = "flex items-center gap-2 px-6 py-3 rounded-full font-semibold transition-all shadow-lg active:scale-95 bg-white border-2 border-zinc-200 text-zinc-800 hover:bg-zinc-100";
            iconWind.classList.remove('hidden');
            iconRocket.classList.add('hidden');
            textGravity.innerText = 'Mất trọng lực';

            // Dịch chuyển khối về lại vị trí ban đầu và ngắt lực quán tính
            bodiesData.forEach(({ dom, body, startX, startY, startAngle }) => {
                const freshX = window.innerWidth * parseFloat(dom.getAttribute('data-x'));
                const freshY = window.innerHeight * parseFloat(dom.getAttribute('data-y'));
                
                Matter.Body.setPosition(body, { x: freshX, y: freshY });
                Matter.Body.setVelocity(body, { x: 0, y: 0 });
                Matter.Body.setAngle(body, startAngle);
                Matter.Body.setAngularVelocity(body, 0);
            });
        });

        // Xử lý khi thu phóng cửa sổ trình duyệt
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            render.canvas.width = width;
            render.canvas.height = height;
            
            Matter.Body.setPosition(bottomWall, { x: width / 2, y: height + 50 });
            Matter.Body.setPosition(rightWall, { x: width + 50, y: height / 2 });
            Matter.Body.setPosition(topWall, { x: width / 2, y: -150 });
        });
    </script>
</body>
</html>
